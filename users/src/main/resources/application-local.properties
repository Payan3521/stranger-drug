# Configuración de Rate Limiting
rate.limit.default-limit=60
rate.limit.endpoint-limits.register_customer=10
rate.limit.endpoint-limits.terms_get_all_active=20
rate.limit.endpoint-limits.terms_get_by_type=20
rate.limit.endpoint-limits.terms_get_all=20
rate.limit.endpoint-limits.terms_get_by_id=20
rate.limit.endpoint-limits.terms_accept_single=5
rate.limit.endpoint-limits.terms_accept_multiple=5
rate.limit.endpoint-limits.terms_verify_acceptance=5
rate.limit.endpoint-limits.terms_verify_by_email=5
