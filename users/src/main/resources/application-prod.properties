# ========================================
# CONFIGURACIÓN PARA PRODUCCIÓN
# ========================================

# Importar configuraciones base
spring.profiles.include=common,database,security,email,logging,rate-limit

# Configuraciones específicas para producción
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
logging.level.com.microserviceone.users=WARN
logging.level.org.springframework=ERROR

# Base de datos para producción (REQUIERE variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Email para producción
spring.mail.username=${EMAIL_USER}
spring.mail.password=${MAIL_PASSWORD}

# JWT para producción (REQUIERE variables de entorno)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:864000000}

# Configuración de seguridad para producción
management.endpoints.web.exposure.include=health,info