spring.application.name=gateway-service
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
spring.cloud.compatibility-verifier.enabled=false

# Configuración de rutas del Gateway
spring.cloud.gateway.routes[0].id=users-service
spring.cloud.gateway.routes[0].uri=lb://users-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/users/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[1].id=compras-service
spring.cloud.gateway.routes[1].uri=lb://compras-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/compras/**

spring.cloud.gateway.routes[2].id=login-service
spring.cloud.gateway.routes[2].uri=lb://login-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/login/**

spring.cloud.gateway.routes[3].id=notificaciones-service
spring.cloud.gateway.routes[3].uri=lb://notificaciones-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/notificaciones/**

spring.cloud.gateway.routes[4].id=pagos-service
spring.cloud.gateway.routes[4].uri=lb://pagos-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/pagos/**

spring.cloud.gateway.routes[5].id=terminoscondiciones-service
spring.cloud.gateway.routes[5].uri=lb://terminoscondiciones-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/terminoscondiciones/**

spring.cloud.gateway.routes[6].id=videos-service
spring.cloud.gateway.routes[6].uri=lb://videos-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/videos/**

# Configuración de JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=864000000

# Configuración de CORS para desarrollo
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*