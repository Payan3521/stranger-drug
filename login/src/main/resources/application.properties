spring.application.name=login-service
server.port=8084
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
spring.cloud.compatibility-verifier.enabled=false

# ========================================
# CONFIGURACIÓN DE BASE DE DATOS
# ========================================
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/login}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:12345}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ========================================
# CONFIGURACIÓN DE FEIGN
# ========================================
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic

# ========================================
# CONFIGURACIÓN DE SEGURIDAD
# ========================================
security.max-failed-attempts=5
security.lockout-duration-minutes=15

# ========================================
# CONFIGURACIÓN DE JWT INTERNO
# ========================================
internal-jwt.secret=${JWT_INTERNAL_SECRET:internal-secret-key-for-microservice-communication}

# ========================================
# CONFIGURACIÓN DE JWT
# ========================================
jwt.secret=${JWT_SECRET:844069fcfa249829af517a5b93350cdc2060d1bbe476c448da5f474393da186f}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}